<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 - 보이는 학생의 수 구하기</title>
</head>
<body>
    <script>
        function solution(arr) {
        let answer = 1; // 맨 처음 학생
        let max = arr[0];

        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > max) {
                answer++;    
                max = arr[i]; 
            }
        }

     return answer;
    }

    let arr = [130, 135, 148, 140, 145, 150, 150, 153];
    console.log(solution(arr)); 
    </script>
</body>
</html>
