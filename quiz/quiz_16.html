<html>
  <head>
    <title>수학 경시 대회 문제 - 이진 트리</title>
    <body>
      <script>
        function solution(m, ps, pt) {
          let answer = 0;
          let n = ps.length;
          function DFS(L, sum, time) {
            if (time > m) return;
            if (L === n) {
              console.log(sum, time);
              answer = Math.max(answer, sum);
            } else {
              DFS(L + 1, sum + ps[L], time + pt[L]);
              DFS(L + 1, sum, time);
            }
          }
          DFS(0, 0, 0);
          return answer;
        }
        let ps = [10, 25, 15, 6, 7];
        let pt = [5, 12, 6, 3, 4];
        console.log(solution(20, ps, pt));
      </script>
    </body>
  </head>
</html>
