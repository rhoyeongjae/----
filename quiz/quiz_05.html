<html>
  <head>
    <title>stack - 괄호안에 있는 문자들을 제거</title>
    <body>
      <script>
        function solution(s) {
          let stack = [];

          for (let x of s) {
            if (x === ")") {
              while (stack.pop() !== "(");
            } else {
              stack.push(x);
            }
          }

          return stack.join("");
        }

        let str = "(A(BC)D)EF(G(H)(IJ)K)LM(N)";
        console.log(solution(str));
      </script>
    </body>
  </head>
</html>
