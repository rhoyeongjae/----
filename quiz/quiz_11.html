<html>
  <head>
    <title>회의실 배정</title>
  </head>
  <body>
    <script>
      function solution(meeting) {
        meeting.sort((a, b) => {
          if (a[1] === b[1]) return a[0] - b[0];
          else return a[1] - b[1];
        });

        let answer = 0;
        let endTime = 0;

        for (let x of meeting) {
          if (x[0] >= endTime) {
            answer++;
            endTime = x[1];
          }
        }

        return answer;
      }

      let arr1 = [
        [1, 4],
        [2, 3],
        [3, 5],
        [4, 6],
        [5, 7],
      ];
      console.log(solution(arr1)); // 출력: 3

      let arr2 = [
        [3, 3],
        [1, 3],
        [2, 3],
      ];
      console.log(solution(arr2)); // 출력: 2
    </script>
  </body>
</html>
