<html>
  <head>
    <title>배열 - 점수 타운팅</title>
    <body>
      <script>
        function solution(arr) {
          let answer = 0;
          let cnt = 0;

          for (let i of arr) {
            if (i === 1) {
              cnt++;
              answer += cnt;
            } else {
              cnt = 0;
            }
          }

          return answer;
        }

        let arr = [1, 1, 1, 0, 0, 1, 1, 0, 1];
        console.log(solution(arr));
      </script>
    </body>
  </head>
</html>
