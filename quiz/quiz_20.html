<html>
  <head>
    <title>그래프 경로탐색 - BGS</title>
    <body>
      <script>
        function solution() {
          let answer = "";
          let queue = [];
          queue.unshift(1);
          while (queue.length) {
            let v = queue.pop();
            answer += v + "";

            for (let nv of [v * 2, v * 2 + 1]) {
              if (nv > 7) break;
              queue.unshift(nv);
            }
          }

          return answer;
        }
        console.log(solution());
      </script>
    </body>
  </head>
</html>
