<html>
  <head>
    <title>그래프 경로탐색 - 인접 리스트</title>
    <body>
      <script>
        function solution(n, arr) {
          let answer = 0;
          let graph = Array.from(Array(n + 1), () => Array());
          let visited = Array.from({ length: n + 1 }, () => 0);

          for (let [a, b] of arr) {
            graph[a].push(b);
          }

          function DFS(v) {
            if (v === n) {
              answer++;
              return;
            } else {
              for (let next of graph[v]) {
                if (visited[next] === 0) {
                  visited[next] = 1;
                  DFS(next);
                  visited[next] = 0;
                }
              }
            }
          }
          visited[1] = 1;
          DFS(1);
          return answer;
        }
        let arr = [
          [1, 2],
          [1, 3],
          [1, 4],
          [2, 1],
          [2, 3],
          [2, 5],
          [3, 4],
          [4, 2],
          [4, 5],
        ];

        console.log(solution(5, arr));
      </script>
    </body>
  </head>
</html>
