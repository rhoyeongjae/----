<html>
  <head>
    <title>stack - 괄호 문법 검사기</title>
    <body>
      <script>
        function solution(a) {
          let answer = "YES";
          let stack = [];
          for (let b of a) {
            // 여는 괄호 push
            if (b === "(") stack.push(b);
            else {
              // 닫는 괄호 pop
              if (stack.length === 0) return "NO";
              stack.pop();
            }
          }
          if (stack > 0) return "NO";
          return answer;
        }

        let a = "()";
        console.log(solution(a));
      </script>
    </body>
  </head>
</html>
